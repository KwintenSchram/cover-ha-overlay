name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Verify & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Signing credentials are deliberately NOT stored in this repository or in GitHub
      # secrets. CI verifies that the release build compiles and passes tests; the signed APK
      # is produced locally by the maintainer and attached to the release by hand.
      #
      # Releases up to and including v1.0.0 were signed with the public Android debug key.
      # Falling back to that key here would reintroduce the exact problem, so this job builds
      # release only to prove it compiles and never publishes the unsigned artifact.
      - name: Build Release (verification only, unsigned)
        run: ./gradlew assembleRelease

      - name: Confirm no debug-signed artifact is published
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::A signed app-release.apk appeared in CI. Signing credentials must not be available here."
            exit 1
          fi
          echo "Release build verified (unsigned, not published)."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cover HA Overlay ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            > Attach the locally-built **signed** APK to this draft, then publish.
            >
            > Build it with:
            > `./gradlew assembleRelease` (with `COVERHA_KEYSTORE_*` set in `~/.gradle/gradle.properties`)
