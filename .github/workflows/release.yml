name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release & Debug APKs
        run: |
          ./gradlew assembleRelease assembleDebug
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk CoverHAOverlay-${{ github.ref_name }}.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk CoverHAOverlay-${{ github.ref_name }}.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cover HA Overlay ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            CoverHAOverlay-${{ github.ref_name }}.apk
            app/build/outputs/apk/debug/app-debug.apk
